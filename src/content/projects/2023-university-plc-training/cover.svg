<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f7f9"/>
  <text x="80" y="92" font-size="30" font-weight="700" fill="#16191d">University PLC &amp; process-control training</text>
  <text x="80" y="132" font-size="22" fill="#5b6470">Six hands-on courses on S7-1200 trainer kits and a pressure-process rig</text>

  <g font-size="21" fill="#16191d">
    <rect x="80" y="200" width="440" height="110" rx="12" fill="#fff" stroke="#dde1e6" stroke-width="2"/><text x="110" y="248" font-weight="600">1 · PLC ladder</text><text x="110" y="280" fill="#5b6470" font-size="17">contacts, timers, counters</text>
    <rect x="580" y="200" width="440" height="110" rx="12" fill="#fff" stroke="#dde1e6" stroke-width="2"/><text x="610" y="248" font-weight="600">2 · TIA Portal V17</text><text x="610" y="280" fill="#5b6470" font-size="17">projects, hardware, blocks</text>
    <rect x="1080" y="200" width="440" height="110" rx="12" fill="#fff" stroke="#dde1e6" stroke-width="2"/><text x="1110" y="248" font-weight="600">3 · KTP700 HMI</text><text x="1110" y="280" fill="#5b6470" font-size="17">screens, tags, alarms</text>
    <rect x="1080" y="370" width="440" height="110" rx="12" fill="#fff" stroke="#dde1e6" stroke-width="2"/><text x="1110" y="418" font-weight="600">4 · Pressure control</text><text x="1110" y="450" fill="#5b6470" font-size="17">PID on a real process rig</text>
    <rect x="580" y="370" width="440" height="110" rx="12" fill="#fff" stroke="#dde1e6" stroke-width="2"/><text x="610" y="418" font-weight="600">5 · Modern manufacturing</text><text x="610" y="450" fill="#5b6470" font-size="17">automation in today's plants</text>
    <rect x="80" y="370" width="440" height="110" rx="12" fill="#0b6e8a"/><text x="110" y="418" font-weight="600" fill="#fff">6 · Cloud IoT</text><text x="110" y="450" fill="#d6edf3" font-size="17">PLC data to a dashboard</text>
  </g>
  <line x1="522" y1="255" x2="572" y2="255" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
  <line x1="1022" y1="255" x2="1072" y2="255" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
  <line x1="1300" y1="312" x2="1300" y2="362" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
  <line x1="1078" y1="425" x2="1028" y2="425" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
  <line x1="578" y1="425" x2="528" y2="425" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>

  <!-- trainer kit -->
  <rect x="80" y="540" width="700" height="220" rx="14" fill="#fff" stroke="#dde1e6" stroke-width="2"/>
  <text x="110" y="580" font-size="20" font-weight="700" fill="#16191d">Bench trainer per student</text>
  <rect x="110" y="605" width="150" height="120" rx="6" fill="#e3f1f5" stroke="#0b6e8a"/><text x="185" y="672" font-size="17" text-anchor="middle">S7-1200</text>
  <rect x="290" y="605" width="200" height="120" rx="6" fill="#16191d"/><rect x="302" y="617" width="176" height="96" fill="#3a6b7a"/><text x="390" y="672" font-size="17" fill="#fff" text-anchor="middle">KTP700</text>
  <g><circle cx="545" cy="635" r="16" fill="#2ea44f"/><circle cx="600" cy="635" r="16" fill="#d73a49"/><circle cx="655" cy="635" r="16" fill="#f2c94c"/><circle cx="545" cy="695" r="16" fill="#9aa4b0"/><circle cx="600" cy="695" r="16" fill="#9aa4b0"/><circle cx="655" cy="695" r="16" fill="#9aa4b0"/></g>

  <!-- pressure rig -->
  <rect x="820" y="540" width="700" height="220" rx="14" fill="#fff" stroke="#dde1e6" stroke-width="2"/>
  <text x="850" y="580" font-size="20" font-weight="700" fill="#16191d">Pressure-process rig</text>
  <g font-size="16" fill="#16191d">
    <polyline points="870,670 1000,670 1000,640 1040,640" fill="none" stroke="#5b6470" stroke-width="4"/>
    <text x="870" y="700">air supply</text>
    <path d="M1040 620 L1080 640 L1040 660 Z M1120 620 L1080 640 L1120 660 Z" fill="#fff" stroke="#16191d" stroke-width="3"/>
    <text x="1080" y="700" text-anchor="middle">PCV-101</text>
    <line x1="1120" y1="640" x2="1300" y2="640" stroke="#5b6470" stroke-width="4"/>
    <circle cx="1230" cy="640" r="30" fill="#fff" stroke="#0b6e8a" stroke-width="3"/><text x="1230" y="646" text-anchor="middle">PT</text>
    <rect x="1340" y="605" width="140" height="70" rx="8" fill="#0b6e8a"/><text x="1410" y="646" fill="#fff" text-anchor="middle">PIC · PID</text>
    <line x1="1260" y1="640" x2="1332" y2="640" stroke="#0b6e8a" stroke-width="3" stroke-dasharray="6 5"/>
  </g>
</svg>
