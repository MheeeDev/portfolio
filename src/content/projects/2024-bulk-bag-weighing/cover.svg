<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f7f9"/>
  <text x="80" y="92" font-size="30" font-weight="700" fill="#16191d">Bulk-bag filling &amp; weighing station</text>
  <text x="80" y="132" font-size="22" fill="#5b6470">Feed → dust collection → fill by weight → pallet out · one overview for the operator</text>

  <rect x="80" y="180" width="1440" height="580" rx="14" fill="#fff" stroke="#dde1e6" stroke-width="2"/>
  <g stroke="#5b6470" stroke-width="3" fill="#fff">
    <!-- hopper -->
    <path d="M200 260 L380 260 L330 380 L250 380 Z"/>
    <line x1="290" y1="380" x2="290" y2="440"/>
    <!-- screw feeder -->
    <rect x="270" y="440" width="320" height="50" rx="8"/>
    <!-- dust collector -->
    <rect x="700" y="230" width="140" height="200" rx="10"/>
    <path d="M700 430 L770 490 L840 430"/>
    <!-- filling head and frame -->
    <line x1="560" y1="490" x2="560" y2="540"/>
    <rect x="470" y="540" width="190" height="40" rx="6"/>
    <path d="M490 580 L640 580 L620 690 L510 690 Z" fill="#e3f1f5"/>
    <line x1="440" y1="530" x2="440" y2="700"/><line x1="690" y1="530" x2="690" y2="700"/><line x1="440" y1="530" x2="690" y2="530"/>
    <!-- conveyor -->
    <rect x="420" y="700" width="760" height="24" rx="12"/>
    <circle cx="450" cy="712" r="9"/><circle cx="1150" cy="712" r="9"/>
    <rect x="980" y="620" width="130" height="80" rx="8" fill="#e3f1f5"/>
  </g>
  <polyline points="770,490 770,520 660,560" fill="none" stroke="#9aa4b0" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="1110" y1="660" x2="1240" y2="660" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
  <g font-size="19" fill="#16191d">
    <text x="210" y="250">Feed hopper</text>
    <text x="300" y="525">Feeder</text>
    <text x="700" y="215">Dust collector</text>
    <text x="300" y="610">Filling head</text>
    <text x="300" y="640" fill="#5b6470" font-size="16">on weighing frame</text>
    <text x="990" y="600">Full bag on pallet</text>
  </g>
  <!-- weight readout -->
  <rect x="1230" y="240" width="250" height="200" rx="12" fill="#0b6e8a"/>
  <text x="1255" y="285" font-size="19" fill="#d6edf3">Set weight</text>
  <text x="1255" y="325" font-size="30" font-weight="700" fill="#fff">— kg</text>
  <text x="1255" y="370" font-size="19" fill="#d6edf3">Actual weight</text>
  <text x="1255" y="410" font-size="30" font-weight="700" fill="#fff">— kg</text>

  <text x="80" y="830" font-size="20" fill="#5b6470">PLC program and HMI for the whole line, start to end · S7-1200 · commissioned in a running plant</text>
</svg>
