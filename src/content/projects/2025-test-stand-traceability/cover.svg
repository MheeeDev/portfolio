<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f7f9"/>
  <text x="80" y="92" font-size="30" font-weight="700" fill="#16191d">End-of-line test stands — PLC ↔ MES contract</text>
  <text x="80" y="132" font-size="22" fill="#5b6470">Paired request/response structures instead of a flat tag list</text>

  <!-- left: stands -->
  <g font-size="21">
    <rect x="80" y="190" width="380" height="560" rx="14" fill="#fff" stroke="#16191d" stroke-width="2"/>
    <text x="110" y="240" font-weight="700" fill="#16191d" font-size="24">Test stands</text>
    <text x="110" y="272" fill="#5b6470" font-size="18">ControlLogix · FactoryTalk Optix HMI</text>
    <g fill="#16191d">
      <rect x="110" y="300" width="320" height="64" rx="8" fill="#e3f1f5"/><text x="130" y="340">Electrical safety / hi-pot</text>
      <rect x="110" y="380" width="320" height="64" rx="8" fill="#e3f1f5"/><text x="130" y="420">Ground bond</text>
      <rect x="110" y="460" width="320" height="64" rx="8" fill="#e3f1f5"/><text x="130" y="500">Motor &amp; valve function</text>
      <rect x="110" y="540" width="320" height="64" rx="8" fill="#e3f1f5"/><text x="130" y="580">Gas valve leak test</text>
    </g>
    <text x="110" y="660" fill="#5b6470" font-size="18">Barcode scan → serial number</text>
    <text x="110" y="690" fill="#5b6470" font-size="18">56 feeder circuits generated from CSV</text>
  </g>

  <!-- middle: contract -->
  <g font-size="20" fill="#16191d">
    <text x="800" y="225" text-anchor="middle" font-weight="700" font-size="22" fill="#0b6e8a">Messaging contract (PLC UDTs)</text>
    <g>
      <line x1="470" y1="300" x2="1120" y2="300" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
      <line x1="1120" y1="340" x2="470" y2="340" stroke="#0b6e8a" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/>
      <text x="800" y="288" text-anchor="middle">ModelRequest</text><text x="800" y="370" text-anchor="middle" fill="#5b6470">ModelResponse — test parameters</text>
    </g>
    <g transform="translate(0 130)">
      <line x1="470" y1="300" x2="1120" y2="300" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
      <line x1="1120" y1="340" x2="470" y2="340" stroke="#0b6e8a" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/>
      <text x="800" y="288" text-anchor="middle">ProductSerialRequest</text><text x="800" y="370" text-anchor="middle" fill="#5b6470">ProductSerialResponse — valid?</text>
    </g>
    <g transform="translate(0 260)">
      <line x1="470" y1="300" x2="1120" y2="300" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
      <line x1="1120" y1="340" x2="470" y2="340" stroke="#0b6e8a" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/>
      <text x="800" y="288" text-anchor="middle">ProductResultRequest</text><text x="800" y="370" text-anchor="middle" fill="#5b6470">ProductResultResponse — stored</text>
    </g>
  </g>

  <!-- right: MES -->
  <g font-size="21">
    <rect x="1130" y="190" width="390" height="560" rx="14" fill="#0b6e8a"/>
    <text x="1160" y="240" font-weight="700" fill="#fff" font-size="24">MES layer</text>
    <text x="1160" y="272" fill="#d7eef4" font-size="18">Ignition · MySQL</text>
    <g fill="#16191d">
      <rect x="1160" y="320" width="330" height="70" rx="8" fill="#fff"/><text x="1180" y="363">Product models</text>
      <rect x="1160" y="410" width="330" height="70" rx="8" fill="#fff"/><text x="1180" y="453">Serial numbers</text>
      <rect x="1160" y="500" width="330" height="70" rx="8" fill="#fff"/><text x="1180" y="543">Test results (~1.4 GB)</text>
      <rect x="1160" y="590" width="330" height="70" rx="8" fill="#fff"/><text x="1180" y="633">Users &amp; permissions</text>
    </g>
  </g>
  <text x="80" y="830" font-size="20" fill="#5b6470">A new product model is a database row — no PLC change.</text>
</svg>
