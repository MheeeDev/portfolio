<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f7f9"/>
  <text x="80" y="92" font-size="30" font-weight="700" fill="#16191d">Process control cloud lab — architecture</text>
  <text x="80" y="132" font-size="22" fill="#5b6470">Student Simulink runs → encrypted tunnel → InfluxDB + Grafana on AWS · no public service port</text>

  <!-- clients -->
  <rect x="80" y="190" width="380" height="560" rx="14" fill="#fff" stroke="#dde1e6" stroke-width="2"/>
  <text x="110" y="232" font-size="22" font-weight="700" fill="#16191d">Student laptops × 120</text>
  <g font-size="19" fill="#16191d">
    <rect x="110" y="260" width="320" height="70" rx="10" fill="#e3f1f5"/><text x="130" y="303">Simulink model · 1 Hz</text>
    <rect x="110" y="350" width="320" height="70" rx="10" fill="#e3f1f5"/><text x="130" y="393">Buffer 5–10 s · retry</text>
    <rect x="110" y="440" width="320" height="70" rx="10" fill="#e3f1f5"/><text x="130" y="483">USE_OPC = 0 · SIM twin</text>
    <rect x="110" y="530" width="320" height="70" rx="10" fill="#e3f1f5"/><text x="130" y="573">USE_OPC = 1 · real rig</text>
  </g>
  <text x="110" y="650" font-size="17" fill="#5b6470">tag student = ID  ·  _SIM for simulation</text>
  <text x="110" y="680" font-size="17" fill="#5b6470">peak ≈ 960 field-values/s</text>

  <!-- tunnel -->
  <rect x="520" y="400" width="190" height="90" rx="45" fill="none" stroke="#0b6e8a" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="615" y="440" font-size="19" font-weight="600" fill="#0b6e8a" text-anchor="middle">Tailscale</text>
  <text x="615" y="466" font-size="16" fill="#5b6470" text-anchor="middle">WireGuard · ACL</text>
  <line x1="462" y1="445" x2="512" y2="445" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
  <line x1="712" y1="445" x2="772" y2="445" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>

  <!-- AWS -->
  <rect x="780" y="190" width="740" height="560" rx="14" fill="#fff" stroke="#0b6e8a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="810" y="232" font-size="22" font-weight="700" fill="#16191d">AWS · one EC2 instance · Docker Compose</text>
  <g font-size="20" fill="#16191d">
    <rect x="810" y="270" width="320" height="90" rx="10" fill="#0b6e8a"/><text x="835" y="312" fill="#fff" font-weight="600">InfluxDB</text><text x="835" y="340" fill="#d6edf3" font-size="16">raw 180 d · 1-min 3 yr</text>
    <rect x="1170" y="270" width="320" height="90" rx="10" fill="#0b6e8a"/><text x="1195" y="312" fill="#fff" font-weight="600">Grafana</text><text x="1195" y="340" fill="#d6edf3" font-size="16">SIM vs PLANT dashboards</text>
    <line x1="1132" y1="315" x2="1162" y2="315" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
    <rect x="810" y="410" width="320" height="90" rx="10" fill="#e3f1f5"/><text x="835" y="452" font-weight="600">PostgreSQL archive</text><text x="835" y="480" fill="#5b6470" font-size="16">sync 10 min · verify 6 h</text>
    <rect x="1170" y="410" width="320" height="90" rx="10" fill="#e3f1f5"/><text x="1195" y="452" font-weight="600">Tuning web app</text><text x="1195" y="480" fill="#5b6470" font-size="16">FastAPI · React · PDF report</text>
    <line x1="970" y1="362" x2="970" y2="402" stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)"/>
    <rect x="810" y="550" width="680" height="80" rx="10" fill="#eef0f3"/><text x="835" y="598">Snapshots nightly · weekly backup to S3 · restore test</text>
  </g>
  <text x="810" y="700" font-size="17" fill="#5b6470">Security group: VPN port in, nothing else — no public 22 / 3000 / 8086</text>

  <text x="80" y="830" font-size="20" fill="#5b6470">Models: Single Level · Single Flow · Cascade Level–Flow · MPC Level–Flow–VSD</text>
</svg>
