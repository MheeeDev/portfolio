<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f7f9"/>
  <text x="80" y="92" font-size="30" font-weight="700" fill="#16191d">Keg line control upgrade — before and after</text>
  <text x="80" y="132" font-size="22" fill="#5b6470">Conveyor, filler and vision cabinets · S7-300 retrofit to S7-1500 on a running line</text>

  <!-- before -->
  <rect x="80" y="190" width="420" height="560" rx="14" fill="#fff" stroke="#dde1e6" stroke-width="2"/>
  <text x="110" y="232" font-size="22" font-weight="700" fill="#5b6470">Before</text>
  <g font-size="20" fill="#5b6470">
    <rect x="110" y="260" width="360" height="80" rx="10" fill="#eef0f3"/><text x="135" y="308">SIMATIC S7-300</text>
    <rect x="110" y="360" width="360" height="80" rx="10" fill="#eef0f3"/><text x="135" y="408">Pro-face operator panels</text>
    <rect x="110" y="460" width="360" height="80" rx="10" fill="#eef0f3"/><text x="135" y="508">Lamp mimic board</text>
    <rect x="110" y="560" width="360" height="80" rx="10" fill="#eef0f3"/><text x="135" y="608">Old drives · undocumented wiring</text>
  </g>
  <text x="110" y="700" font-size="17" fill="#5b6470">Backed up first: PLC, HMI, safety, drive parameters</text>

  <line x1="510" y1="470" x2="580" y2="470" stroke="#0b6e8a" stroke-width="6" marker-end="url(#a)"/>

  <!-- after -->
  <rect x="600" y="190" width="920" height="560" rx="14" fill="#fff" stroke="#0b6e8a" stroke-width="2"/>
  <text x="630" y="232" font-size="22" font-weight="700" fill="#16191d">After · new SS304 IP55 cabinets</text>
  <g font-size="20" fill="#16191d">
    <rect x="630" y="260" width="400" height="100" rx="10" fill="#0b6e8a"/><text x="655" y="303" fill="#fff" font-weight="600">CPU 1515-2 PN</text><text x="655" y="333" fill="#d6edf3" font-size="16">TIA Portal V17 · LAD · STL · SCL</text>
    <rect x="1080" y="260" width="410" height="100" rx="10" fill="#e3f1f5"/><text x="1105" y="303" font-weight="600">TP1200 / TP1500 / TP1900</text><text x="1105" y="333" fill="#5b6470" font-size="16">Comfort panels · ISA-5.5 colours</text>
    <line x1="1032" y1="310" x2="1072" y2="310" stroke="#2ea44f" stroke-width="4"/>
    <rect x="630" y="400" width="190" height="90" rx="10" fill="#fff4cc"/><text x="650" y="440" font-weight="600">PNOZ s4</text><text x="650" y="468" fill="#5b6470" font-size="16">safety relay</text>
    <rect x="840" y="400" width="190" height="90" rx="10" fill="#e3f1f5"/><text x="860" y="440" font-weight="600">FC 302 ×2</text><text x="860" y="468" fill="#5b6470" font-size="16">Danfoss drives</text>
    <rect x="1080" y="400" width="410" height="90" rx="10" fill="#e3f1f5"/><text x="1105" y="440" font-weight="600">Remote I/O · switch</text><text x="1105" y="468" fill="#5b6470" font-size="16">filler panel on a 270° stand</text>
    <rect x="1080" y="530" width="410" height="90" rx="10" fill="#eef0f3"/><text x="1105" y="570" font-weight="600">Vision controller</text><text x="1105" y="598" fill="#5b6470" font-size="16">existing — kept and reconnected</text>
    <polyline points="830,362 830,575 1072,575" fill="none" stroke="#8a3ffc" stroke-width="4"/>
    <line x1="730" y1="362" x2="730" y2="392" stroke="#16191d" stroke-width="3"/>
    <line x1="935" y1="362" x2="935" y2="392" stroke="#16191d" stroke-width="3"/>
    <line x1="1032" y1="340" x2="1060" y2="340" stroke="#2ea44f" stroke-width="4"/>
    <polyline points="1060,340 1060,445 1072,445" fill="none" stroke="#2ea44f" stroke-width="4"/>
  </g>
  <g font-size="17">
    <line x1="630" y1="680" x2="670" y2="680" stroke="#2ea44f" stroke-width="4"/><text x="680" y="686" fill="#5b6470">PROFINET</text>
    <line x1="800" y1="680" x2="840" y2="680" stroke="#8a3ffc" stroke-width="4"/><text x="850" y="686" fill="#5b6470">PROFIBUS</text>
    <line x1="960" y1="680" x2="1000" y2="680" stroke="#16191d" stroke-width="3"/><text x="1010" y="686" fill="#5b6470">hardwired</text>
  </g>

  <text x="80" y="830" font-size="20" fill="#5b6470">PackML / ISA-88 state model · 100 % I/O test before shipping · 72-hour run · 2-day training</text>
</svg>
