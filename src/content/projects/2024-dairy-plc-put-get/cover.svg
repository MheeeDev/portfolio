<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f7f9"/>
  <text x="80" y="92" font-size="30" font-weight="700" fill="#16191d">PLC-to-PLC data exchange — S7-1200 and S7-300</text>
  <text x="80" y="132" font-size="22" fill="#5b6470">S7 communication with PUT and GET over Ethernet · no extra hardwired signals</text>

  <g font-size="21" fill="#16191d">
    <rect x="80" y="200" width="520" height="520" rx="14" fill="#fff" stroke="#0b6e8a" stroke-width="2"/>
    <text x="110" y="245" font-size="24" font-weight="700">S7-1200</text>
    <text x="110" y="275" fill="#5b6470" font-size="17">new equipment</text>
    <rect x="110" y="310" width="460" height="90" rx="10" fill="#0b6e8a"/><text x="135" y="352" fill="#fff" font-weight="600">GET · PUT instructions</text><text x="135" y="380" fill="#d6edf3" font-size="16">REQ · DONE · ERROR · STATUS</text>
    <rect x="110" y="430" width="460" height="120" rx="10" fill="#e3f1f5"/><text x="135" y="472" font-weight="600">Local data block</text><text x="135" y="502" fill="#5b6470" font-size="16">received and sent values</text><text x="135" y="528" fill="#5b6470" font-size="16">link status → fault on loss</text>
    <rect x="110" y="580" width="460" height="100" rx="10" fill="#eef0f3"/><text x="135" y="622" font-weight="600">Protection settings</text><text x="135" y="650" fill="#5b6470" font-size="16">PUT/GET access permitted when accessed</text>

    <rect x="1000" y="200" width="520" height="520" rx="14" fill="#fff" stroke="#dde1e6" stroke-width="2"/>
    <text x="1030" y="245" font-size="24" font-weight="700">S7-300</text>
    <text x="1030" y="275" fill="#5b6470" font-size="17">existing process control</text>
    <rect x="1030" y="310" width="460" height="240" rx="10" fill="#e3f1f5"/>
    <text x="1055" y="352" font-weight="600">Shared data block · absolute addresses</text>
    <g font-size="17" font-family="Consolas, monospace">
      <text x="1055" y="395">DBX 0.0  status bits</text>
      <text x="1055" y="425">DBW 2    values</text>
      <text x="1055" y="455">DBD 4    …</text>
      <text x="1055" y="485">DBW n    …</text>
    </g>
    <text x="1055" y="530" fill="#5b6470" font-size="16">same layout on both sides</text>
  </g>

  <line x1="602" y1="380" x2="992" y2="380" stroke="#0b6e8a" stroke-width="5" marker-end="url(#a)"/>
  <text x="797" y="365" font-size="20" fill="#0b6e8a" text-anchor="middle" font-weight="600">PUT — write</text>
  <line x1="992" y1="470" x2="602" y2="470" stroke="#0b6e8a" stroke-width="5" marker-end="url(#a)"/>
  <text x="797" y="505" font-size="20" fill="#0b6e8a" text-anchor="middle" font-weight="600">GET — read</text>
  <text x="797" y="600" font-size="18" fill="#5b6470" text-anchor="middle">S7 connection over Ethernet</text>

  <text x="80" y="820" font-size="20" fill="#5b6470">Dairy plant · tested on site with both controllers running</text>
</svg>
