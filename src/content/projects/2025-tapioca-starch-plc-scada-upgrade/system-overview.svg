<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a94a1"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f7f9"/>
  <text x="80" y="92" font-size="30" font-weight="700" fill="#16191d">Tapioca starch plant — PLC &amp; SCADA upgrade, two lines</text>
  <text x="80" y="132" font-size="22" fill="#5b6470">One device library from the instrument list to the faceplate · one state machine for every sequence</text>

  <!-- layers -->
  <g font-size="19" fill="#16191d">
    <rect x="80" y="180" width="270" height="300" rx="14" fill="#fff" stroke="#16191d" stroke-width="2"/>
    <text x="105" y="222" font-weight="700" font-size="22">Field</text>
    <text x="105" y="250" fill="#5b6470" font-size="16">Instrument list = source</text>
    <text x="105" y="318" font-size="54" font-weight="800" fill="#0b6e8a">400+</text>
    <text x="105" y="348" fill="#5b6470" font-size="17">devices on 2 lines</text>
    <text x="105" y="395">DOL &amp; VSD motors</text>
    <text x="105" y="425">Analog inputs · valves</text>

    <rect x="400" y="180" width="270" height="300" rx="14" fill="#fff" stroke="#16191d" stroke-width="2"/>
    <text x="425" y="222" font-weight="700" font-size="22">Remote I/O</text>
    <text x="425" y="250" fill="#5b6470" font-size="16">POINT I/O 1734 · EtherNet/IP</text>
    <text x="425" y="318" font-size="54" font-weight="800" fill="#0b6e8a">~280</text>
    <text x="425" y="348" fill="#5b6470" font-size="17">channels, Line 1</text>
    <text x="425" y="395">~40 modules</text>
    <text x="425" y="425">~20 % spare</text>

    <rect x="720" y="180" width="370" height="300" rx="14" fill="#0b6e8a"/>
    <text x="745" y="222" font-weight="700" font-size="22" fill="#fff">CompactLogix 1769-L36ERM</text>
    <text x="745" y="250" fill="#d7eef4" font-size="16">Studio 5000 · AOI library</text>
    <g font-size="16" font-family="Consolas, monospace">
      <rect x="745" y="275" width="155" height="40" rx="8" fill="#fff"/><text x="760" y="301">CM_MotorDOL</text>
      <rect x="912" y="275" width="155" height="40" rx="8" fill="#fff"/><text x="927" y="301">CM_MotorVSD</text>
      <rect x="745" y="325" width="155" height="40" rx="8" fill="#fff"/><text x="760" y="351">CM_Valve</text>
      <rect x="912" y="325" width="155" height="40" rx="8" fill="#fff"/><text x="927" y="351">CM_AI</text>
      <rect x="745" y="375" width="322" height="40" rx="8" fill="#e3f1f5"/><text x="760" y="401">CM_PHASE · ~120 sequences</text>
    </g>
    <text x="745" y="452" fill="#d7eef4" font-size="16">Command · Status · Parameter · Interlock · VISU</text>

    <rect x="1140" y="180" width="380" height="300" rx="14" fill="#fff" stroke="#16191d" stroke-width="2"/>
    <text x="1165" y="222" font-weight="700" font-size="22">Ignition SCADA</text>
    <text x="1165" y="250" fill="#5b6470" font-size="16">Vision · Reporting · binds to VISU</text>
    <text x="1165" y="318" font-size="54" font-weight="800" fill="#0b6e8a">7,000+</text>
    <text x="1165" y="348" fill="#5b6470" font-size="17">tag nodes</text>
    <text x="1165" y="395">Screens built from templates</text>
    <text x="1165" y="425">Daily reports · phone alerts</text>
  </g>
  <g stroke="#0b6e8a" stroke-width="4" marker-end="url(#a)">
    <line x1="352" y1="330" x2="394" y2="330"/>
    <line x1="672" y1="330" x2="714" y2="330"/>
    <line x1="1092" y1="330" x2="1134" y2="330"/>
  </g>

  <!-- phase strip -->
  <text x="80" y="560" font-size="22" font-weight="700" fill="#16191d">Every sequence, the same states</text>
  <g font-size="18" font-weight="600" text-anchor="middle" fill="#16191d">
    <rect x="80" y="590" width="160" height="56" rx="12" fill="#fff" stroke="#c5ccd5" stroke-width="2"/><text x="160" y="624">Idle</text>
    <rect x="290" y="590" width="160" height="56" rx="12" fill="#fff" stroke="#c5ccd5" stroke-width="2"/><text x="370" y="624">Starting</text>
    <rect x="500" y="590" width="160" height="56" rx="12" fill="#0b6e8a"/><text x="580" y="624" fill="#fff">Running</text>
    <rect x="710" y="590" width="160" height="56" rx="12" fill="#fff" stroke="#c5ccd5" stroke-width="2"/><text x="790" y="624">Ending</text>
    <rect x="920" y="590" width="160" height="56" rx="12" fill="#fff" stroke="#c5ccd5" stroke-width="2"/><text x="1000" y="624">Complete</text>
    <rect x="500" y="710" width="160" height="56" rx="12" fill="#fff" stroke="#c5ccd5" stroke-width="2"/><text x="580" y="744">Held</text>
    <rect x="290" y="710" width="160" height="56" rx="12" fill="#fff" stroke="#e0a3a3" stroke-width="2"/><text x="370" y="744" fill="#b42318">Aborted</text>
  </g>
  <g stroke="#8a94a1" stroke-width="3" fill="none" marker-end="url(#g)">
    <line x1="242" y1="618" x2="284" y2="618"/>
    <line x1="452" y1="618" x2="494" y2="618"/>
    <line x1="662" y1="618" x2="704" y2="618"/>
    <line x1="872" y1="618" x2="914" y2="618"/>
    <path d="M560 648 V704"/>
    <path d="M600 704 V652"/>
    <path d="M500 640 C 440 680, 400 680, 380 704"/>
  </g>
  <g font-size="16" fill="#5b6470">
    <text x="510" y="684" text-anchor="end">hold</text>
    <text x="612" y="684">restart</text>
    <text x="420" y="672" text-anchor="end">abort</text>
  </g>

  <!-- side note -->
  <g font-size="19" fill="#16191d">
    <rect x="1140" y="560" width="380" height="206" rx="14" fill="#e3f1f5"/>
    <text x="1165" y="600" font-weight="700" font-size="20" fill="#0b6e8a">Phase 2 · a year later, over VPN</text>
    <text x="1165" y="640">TB motors DOL → VSD</text>
    <text x="1165" y="672">TB valve on vibration setpoint</text>
    <text x="1165" y="704">Faceplates: speed %, Hz, vibration</text>
    <text x="1165" y="736" fill="#5b6470" font-size="17">Same screens — they bind to VISU</text>
  </g>
  <text x="80" y="840" font-size="20" fill="#5b6470">FAT with simulated feedback · about five weeks of commissioning, mostly over VPN.</text>
</svg>
