<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="glow" cx="76%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1a1438"/>
      <stop offset="0.5" stop-color="#0b1d2c"/>
      <stop offset="1" stop-color="#05080c"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#132230" stroke-width="1"/>
    </pattern>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- column shell: vapour (blue, top) to liquid (purple, bottom) -->
    <linearGradient id="shell" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.28"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c8b99"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- ============ P&ID: distillation unit ============ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- process lines -->
    <g stroke="#7c8b99" stroke-width="4">
      <path d="M940 440 H1056" marker-end="url(#arr)"/>                     <!-- feed -->
      <path d="M1110 196 V140 H1292"/>                                       <!-- overhead vapour -->
      <path d="M1348 140 H1420 V212"/>                                       <!-- condensate to drum -->
      <path d="M1395 271 V300 H1166" marker-end="url(#arr)"/>              <!-- reflux -->
      <path d="M1510 243 H1566" marker-end="url(#arr)"/>                     <!-- distillate -->
      <path d="M1110 684 V740 H1242"/>                                       <!-- to reboiler -->
      <path d="M1270 712 V660 H1166" marker-end="url(#arr)"/>              <!-- boil-up -->
      <path d="M1298 740 H1560" marker-end="url(#arr)"/>                     <!-- bottoms -->
    </g>

    <!-- column C-101 with elliptical heads -->
    <path d="M1060 236 A50 40 0 0 1 1160 236 V644 A50 40 0 0 1 1060 644 Z" fill="url(#shell)" stroke="#a855f7" stroke-width="5"/>
    <!-- sieve trays with alternating downcomers -->
    <g stroke="#c4a5f5" stroke-width="3">
      <path d="M1060 260 H1138 V280"/><path d="M1160 300 H1082 V320"/>
      <path d="M1060 340 H1138 V360"/><path d="M1160 380 H1082 V400"/>
      <path d="M1060 420 H1138 V440"/><path d="M1160 460 H1082 V480"/>
      <path d="M1060 500 H1138 V520"/><path d="M1160 540 H1082 V560"/>
      <path d="M1060 580 H1138 V600"/><path d="M1160 620 H1082 V640"/>
    </g>

    <!-- condenser E-101 -->
    <circle cx="1320" cy="140" r="28" fill="#0b1a26" stroke="#7c8b99" stroke-width="4"/>
    <path d="M1300 160 L1310 124 L1320 156 L1330 124 L1340 160" stroke="#38bdf8" stroke-width="3"/>
    <!-- reflux drum V-101 -->
    <rect x="1360" y="214" width="150" height="56" rx="28" fill="#0b1a26" stroke="#7c8b99" stroke-width="4"/>
    <path d="M1372 252 H1498" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 6"/>
    <!-- reboiler E-102 -->
    <circle cx="1270" cy="740" r="28" fill="#0b1a26" stroke="#7c8b99" stroke-width="4"/>
    <path d="M1250 760 L1260 724 L1270 756 L1280 724 L1290 760" stroke="#f97316" stroke-width="3"/>

    <!-- instrument signal lines -->
    <g stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 7">
      <path d="M1216 102 V140"/>              <!-- PIC to overhead -->
      <path d="M990 360 V420 H1060"/>         <!-- TIC to tray -->
      <path d="M1285 332 V300"/>              <!-- FIC to reflux -->
      <path d="M1460 330 V270"/>              <!-- LIC to drum -->
    </g>
    <g stroke="#22c55e" stroke-width="2.5" stroke-dasharray="8 7">
      <path d="M1285 392 V600 H1400"/>        <!-- FIC to PLC -->
      <path d="M1460 390 V560"/>              <!-- LIC to PLC -->
    </g>
  </g>

  <!-- instrument bubbles (ISA-5.1 style) -->
  <g font-family="Consolas, monospace" text-anchor="middle">
    <g>
      <circle cx="1216" cy="72" r="30" fill="#0b1a26" stroke="#38bdf8" stroke-width="3.5"/>
      <path d="M1186 72 H1246" stroke="#38bdf8" stroke-width="2"/>
      <text x="1216" y="66" fill="#38bdf8" font-size="17" font-weight="700">PIC</text>
      <text x="1216" y="90" fill="#7f8c99" font-size="13">101</text>
    </g>
    <g>
      <circle cx="990" cy="330" r="30" fill="#0b1a26" stroke="#38bdf8" stroke-width="3.5"/>
      <path d="M960 330 H1020" stroke="#38bdf8" stroke-width="2"/>
      <text x="990" y="324" fill="#38bdf8" font-size="17" font-weight="700">TIC</text>
      <text x="990" y="348" fill="#7f8c99" font-size="13">102</text>
    </g>
    <g>
      <circle cx="1285" cy="362" r="30" fill="#0b1a26" stroke="#38bdf8" stroke-width="3.5"/>
      <path d="M1255 362 H1315" stroke="#38bdf8" stroke-width="2"/>
      <text x="1285" y="356" fill="#38bdf8" font-size="17" font-weight="700">FIC</text>
      <text x="1285" y="380" fill="#7f8c99" font-size="13">103</text>
    </g>
    <g>
      <circle cx="1460" cy="360" r="30" fill="#0b1a26" stroke="#38bdf8" stroke-width="3.5"/>
      <path d="M1430 360 H1490" stroke="#38bdf8" stroke-width="2"/>
      <text x="1460" y="354" fill="#38bdf8" font-size="17" font-weight="700">LIC</text>
      <text x="1460" y="378" fill="#7f8c99" font-size="13">104</text>
    </g>
  </g>

  <!-- PLC -->
  <g>
    <rect x="1400" y="560" width="160" height="96" rx="10" fill="#0b1a26" stroke="#22c55e" stroke-width="4"/>
    <rect x="1414" y="574" width="24" height="68" rx="3" fill="#123024"/>
    <rect x="1444" y="574" width="24" height="68" rx="3" fill="#123024"/>
    <rect x="1474" y="574" width="24" height="68" rx="3" fill="#123024"/>
    <rect x="1504" y="574" width="24" height="68" rx="3" fill="#123024"/>
    <circle cx="1426" cy="586" r="4" fill="#22c55e"/>
    <circle cx="1456" cy="586" r="4" fill="#22c55e"/>
    <circle cx="1486" cy="586" r="4" fill="#22c55e"/>
    <circle cx="1516" cy="586" r="4" fill="#eab308"/>
    <text x="1544" y="614" fill="#22c55e" font-family="Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(-90 1544 614)">PLC</text>
  </g>

  <!-- equipment tags and stream labels -->
  <g font-family="Consolas, monospace" font-size="15" fill="#7f8c99">
    <text x="1046" y="226" text-anchor="end" fill="#a855f7" font-weight="700">C-101</text>
    <text x="1320" y="100" text-anchor="middle">E-101</text>
    <text x="1468" y="204" text-anchor="middle">V-101</text>
    <text x="1270" y="796" text-anchor="middle">E-102</text>
    <text x="940" y="428">FEED</text>
    <text x="1590" y="276" text-anchor="end">DISTILLATE</text>
    <text x="1440" y="728">BOTTOMS</text>
  </g>

  <!-- drawing title block -->
  <g font-family="Consolas, monospace" font-size="14" fill="#7f8c99">
    <rect x="1150" y="822" width="410" height="44" fill="#05080c" stroke="#26445c" stroke-width="1.5"/>
    <path d="M1360 822 V866 M1460 822 V866" stroke="#26445c" stroke-width="1.5"/>
    <text x="1166" y="849">DWG  CHEM-TO-AUTO-001</text>
    <text x="1376" y="849">REV 01</text>
    <text x="1476" y="849">2026</text>
  </g>

  <!-- ============ Title side ============ -->
  <g font-family="Consolas, monospace" font-size="20" fill="#7f8c99">
    <circle cx="128" cy="154" r="7" fill="#22c55e"/>
    <text x="146" y="161">S0 CHEM.STUDENT  →  S4 AUTOMATION.ENGINEER  ·  ACTIVE</text>
  </g>

  <text x="120" y="350" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-5">Chemical</text>
  <text x="120" y="470" fill="url(#txt)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-4">→ Automation</text>
  <text x="124" y="555" fill="#9aa4b0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="500">Initial condition ≠ final value</text>

  <!-- step response: starts at one level, settles at a higher setpoint -->
  <path d="M120 730 H290 C 340 730 350 640 410 630 S 490 655 550 645 S 640 638 700 640 H820" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 730 H290 V640 H820" fill="none" stroke="#3b4a59" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="120" cy="730" r="7" fill="#a855f7"/>
  <circle cx="820" cy="640" r="8" fill="#22c55e"/>
  <text x="120" y="790" fill="#4b5a69" font-family="Consolas, monospace" font-size="20">iamautomationeng.com</text>
</svg>
