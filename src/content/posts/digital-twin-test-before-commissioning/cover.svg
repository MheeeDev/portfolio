    <text x="90" y="-22" fill="#22c55e" font-family="Consolas, monospace" font-size="22" font-weight="700" text-anchor="middle">REAL</text>
  </g>
  <path d="M1190 400 H1290" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 10"/>
  <rect x="1196" y="610" width="270" height="56" rx="28" fill="#0e141b" stroke="#26445c" stroke-width="2"/>
