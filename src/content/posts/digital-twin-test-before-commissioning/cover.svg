      <stop offset="0" stop-color="#132f48"/>
      <stop offset="1" stop-color="#05080c"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14212d" stroke-width="1"/>
    </pattern>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
